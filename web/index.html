<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving this web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build web`.
    If none is provided, the value of `window.location.pathname` is used, which
    indicates the page that the app is served from.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Crazy Block Online - A colorful block puzzle game">

  <!-- iOS meta tags & app icons -->
  <meta name="theme-color" content="#0066FF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Crazy Block Online">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Crazy Block Online</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0066FF;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <!-- This script installs service_worker.js to provide PWA functionality to
       application. For more information, see:
       https://developers.google.com/web/fundamentals/primers/service-workers -->
  <script>
    var serviceWorkerVersion = null;
    var scriptLoaded = false;
    function loadMainDartJs() {
      if (scriptLoaded) {
        return;
      }
      scriptLoaded = true;
      var scriptTag = document.createElement('script');
      scriptTag.src = 'main.dart.js';
      scriptTag.type = 'application/javascript';
      document.body.append(scriptTag);
    }

    if ('serviceWorker' in navigator) {
      // Service workers are supported. Use them.
      window.addEventListener('load', function () {
        // Wait for confirmation from the service worker that it
        // has taken control of the page.
        var messageChannel = new MessageChannel();
        navigator.serviceWorker.controller.postMessage(
          {type: 'SKIP_WAITING'},
          [messageChannel.port2]
        );
      });

      navigator.serviceWorker.ready.then(function (reg) {
        function maybeDisplayUpdateBar() {
          if (!reg.installing) {
            return;
          }
          var popupTriggers = document.querySelectorAll('body');
          var updateBar =
              popupTriggers.length ?
              confirm(
                  'New version available! (old=' + serviceWorkerVersion + ', new=' + registration.installing.cacheKey + ')') :
              true;
          if (updateBar) {
            console.log('Update available.');
          }
        }
        var inspection =
            window.navigator.serviceWorker.oncontrollerchange =
            function () {
          maybeDisplayUpdateBar();
        };
        // Only call maybeDisplayUpdateBar if serviceWorkerVersion was null and the user is loading the app for
        // the first time. If serviceWorkerVersion if not null, then the app is already served by a service
        // worker, and the new service worker will be found in the inspect window.
        if (!serviceWorkerVersion) {
          maybeDisplayUpdateBar();
        }
      });

      // If service worker doesn't succeed in a reasonable time, fallback to plain javascript
      setTimeout(function () {
        if (!scriptLoaded) {
          console.warn(
              'Failed to load app from service worker. Falling back to plain ' +
              'javascript');
          loadMainDartJs();
        }
      }, 4000);
    } else {
      // Service workers not supported. Just start the app.
      loadMainDartJs();
    }
  </script>
</body>
</html>
